name: Run Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        check-latest: true

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run tests
      run: uv run pytest

    - name: Run linting
      run: uv run ruff check .

    - name: Run type checking
      run: uv run ty check .

  sdk-compatibility:
    name: OpenAI ${{ matrix.openai-version }} / Python 3.11
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openai-version: ['1.95.1', '2.0.0', '2.54.0', '3.0.0', '3.14.1']

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        check-latest: true

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Run tests against OpenAI ${{ matrix.openai-version }}
      # The simulated HTTP transport uses httpx, which newer SDKs no longer require.
      run: uv run --locked --group dev --with "openai==${{ matrix.openai-version }}" --with httpx pytest
