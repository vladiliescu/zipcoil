[project]
name = "zipcoil"
version = "0.4.0"
description = "Zipcoil simplifies OpenAI tool usage"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Vlad Iliescu" }]
keywords = ["openai", "tools", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["openai>=1.95.1", "docstring-parser>=0.16"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zipcoil = ["py.typed"]

[project.urls]
Homepage = "https://github.com/vladiliescu/zipcoil"
Repository = "https://github.com/vladiliescu/zipcoil"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
lint.select = ["I", "C90"]      #, "E", "W", "F"]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["zipcoil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[dependency-groups]
# uv-only groups for local development; not published as pip extras
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "ruff==0.16.8",
    "ty==0.0.81"
]
build = [
    "build==1.2.2.post1",
    "twine==6.1.0",
]
